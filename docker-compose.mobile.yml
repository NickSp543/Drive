# Docker Compose for Mobile App Development
# Run with: docker-compose -f docker-compose.mobile.yml up
# This starts the C++ server and Express backend - uses your LOCAL MongoDB.
# Starts MongoDB in Docker
# Run Expo separately on your host machine: cd MobileApp && npx expo start --android

services:
  # C++ File Storage Server
  cpp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drive-cpp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persist file data on host machine
      - ./data:/data
    environment:
      - DATA_DIR=/data

  mongo-setup:
    image: mongo:6.0
    container_name: drive-mongo-setup
    restart: "no"
    depends_on:
      - mongo
    command: >
      sh -lc '
        mongosh "mongodb://root:rootpass@mongo:27017/admin" --quiet --eval "
          const dbname = \"driveDB\";
          const user = \"drive_app\";
          const pwd  = \"drive_app_pass\";
          const dbx = db.getSiblingDB(dbname);
          const existing = dbx.getUser(user);
          if (!existing) {
            dbx.createUser({
              user: user,
              pwd: pwd,
              roles: [{ role: \"readWrite\", db: dbname }]
            });
            print(\"Created user: \" + user + \" in db: \" + dbname);
          } else {
            print(\"User already exists: \" + user + \" in db: \" + dbname);
          }
        "
      '
# MongoDB
  mongo:
    image: mongo:6.0
    container_name: drive-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=rootpass
      - MONGO_INITDB_DATABASE=driveDB
    volumes:
      - mongo-data-mobile:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

  # Express Backend Server
  backend:
    build:
      context: ./express-server
      dockerfile: Dockerfile.node
    container_name: drive-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://drive_app:drive_app_pass@mongo:27017/driveDB?authSource=driveDB
      - JWT_SECRET=your-secret-key-change-in-production
      - CPP_SERVER_HOST=cpp-server
      - CPP_SERVER_PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      cpp-server:
        condition: service_started
      mongo-setup:
        condition: service_completed_successfully

volumes:
  mongo-data-mobile: